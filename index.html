<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gerador de Nomeações — NAF Marques Bom</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header class="hero">
  <div class="pill">NAF MARQUES BOM</div>
  <h1>Gerador de Nomeações</h1>
  <p>Nomeações FPF e nomeação manual · imagem 1080 × 1920</p>
  <nav>
    <button id="pdfBtn" class="tab active">📄 PDF FPF</button>
    <button id="manualBtn" class="tab">🖊️ Nomeação manual</button>
  </nav>
</header>

<main class="card">
<section id="pdfSection">
  <h2>Nomeações da FPF</h2>
  <label>PDF das nomeações</label>
  <div class="fileLine">
    <input id="pdfFile" type="file" accept="application/pdf">
    <span id="fileName"></span>
  </div>

  <label>Lista de árbitros / observadores — um nome por linha</label>
  <textarea id="names" placeholder="Nuno Guerra&#10;Gonçalo Rosa&#10;Fernando Lopes"></textarea>

  <button id="analyzeBtn" class="primary">Ler PDF</button>
  <div id="error" class="error"></div>
  <div id="status" class="status"></div>
  <div id="results"></div>
  <div id="missingAssets" hidden></div>

  <div class="actions">
    <button id="generateBtn" class="primary" disabled>Gerar todos os JPG</button>
  </div>
</section>

<section id="manualSection" hidden>
  <h2>Nomeação manual</h2>
  <div class="grid2">
    <div><label>Competição</label><input id="mCompetition" placeholder="Liga 3 Placard — 2.ª Fase"></div>
    <div><label>Data / hora (opcional)</label><input id="mDate" placeholder="16/08/2026 · 16:00"></div>
    <div>
      <label>Equipa da casa</label>
      <input id="mHome" placeholder="Lusitano de Évora C.">
      <label class="manualShieldLabel">Escudo da casa (opcional)</label>
      <input id="mHomeShield" type="file" accept="image/png,image/jpeg,image/webp">
    </div>
    <div>
      <label>Equipa visitante</label>
      <input id="mAway" placeholder="Atlético CP SAD">
      <label class="manualShieldLabel">Escudo visitante (opcional)</label>
      <input id="mAwayShield" type="file" accept="image/png,image/jpeg,image/webp">
    </div>
  </div>

  <label>Árbitros / observadores</label>
  <div id="manualOfficials"></div>
  <button id="addOfficial" class="secondary" type="button">+ Adicionar oficial</button>
  <button id="manualGenerate" class="primary" type="button">Gerar JPG</button>
</section>
</main>

<footer>NÚCLEO DE ÁRBITROS DE FUTEBOL MARQUES BOM · COIMBRA</footer>
<script type="module" src="/src/app.js"></script>
</body>
</html>
