name: Atualizar base de clubes
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 0'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir base
        run: node scripts/build-club-database.mjs
      - name: Commit alterações
        run: |
          git config user.name 'NAF Marques Bom'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/clubes.json public/escudos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualizar base de clubes e escudos'
          git push
